# One-click deploy on Render: New → Blueprint → pick this repo.
services:
  - type: web
    name: majlis
    runtime: docker
    rootDir: majlis
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: SONIOX_API_KEY, sync: false }
      - { key: APP_PASSWORD, sync: false }
      - { key: BASE_URL, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: OWNER_NAME, sync: false }
      - { key: OWNER_ROLE, sync: false }
      - { key: DIGEST, value: "1" }
